name: CI/CD Production Deployment

on:
  push:
    branches:
      - my-local-changes # 👈 ដូរទៅតាមឈ្មោះ Branch ដែល Chea កំពុងប្រើប្រាស់ពិតប្រាកដក្នុងរូបភាព

jobs:
  # -------------------------------------------------------
  # JOB ទី ១៖ BUILD IMAGE រួចរុញទៅ GitHub Packages (GHCR)
  # -------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 🎯 កែសម្រួលត្រង់នេះ៖ ប្រើឈ្មោះអថេរដកស្រង់អូតូ ដើម្បីឱ្យវាបង្កើត Package ត្រូវតាមឈ្មោះ Repository ពិតប្រាកដ
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

  # -------------------------------------------------------
  # JOB ទី ១ (បន្ថែម)៖ បញ្ជាឱ្យរត់នៅលើម៉ាស៊ីន Dev/Operation របស់ Chea ផ្ទាល់
  # -------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/cms-04 
            git pull origin my-local-changes
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 🔥 ឈប់ប្រើ docker-compose នាំតែញ៉េរញ៉ៃ Network ដូចដែលយើងព្រមព្រៀងគ្នា
            # លុប Container ចាស់ចោល រួចដកទាញយក (Pull) Image ពិតប្រាកដមកបើករត់ភ្លាមៗ
            docker rm -f cms-container || true
            docker pull ghcr.io/cheasmile/my-laravel-app:latest
            
            # រត់ Container ថ្មី ភ្ជាប់ស្ពានទៅរក XAMPP MySQL លើ Windows រួចរត់បង្កើត Seeder (Admin Account) អូតូ
            docker run -d -p 8080:80 --name cms-container --add-host=host.docker.internal:host-gateway --restart always ghcr.io/cheasmile/my-laravel-app:latest
            
            docker image prune -f