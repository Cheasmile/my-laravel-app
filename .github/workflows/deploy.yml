name: CI/CD Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/cheasmile/my-laravel-app:latest # ប្រើអក្សរតូចដាច់ខាត ការពារ Error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}     
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SERVER_SSH_KEY }}   
          port: 22
          script: |
            cd /var/www/cms-04 
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # សម្អាត Container ចាស់ៗចេញ
            docker-compose down || true
            docker rm -f local-cms-container nginx-container || true

            # ទាញយក Image ថ្មីពី GitHub Registry
            docker pull ghcr.io/cheasmile/my-laravel-app:latest

            # បើកដំណើរការប្រព័ន្ធតាមរយៈ Docker Compose លើ Server ឱ្យដើរស្វ័យប្រវត្តិ
            docker-compose up -d --build

            # ទុកពេល ៥ វិនាទីឱ្យ Database និង App ស្គាល់គ្នា រួចបង្កើត Table ទិន្នន័យ
            sleep 5
            docker exec local-cms-container php artisan migrate:fresh --seed --force
            docker image prune -f