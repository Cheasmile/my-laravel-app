- name: Update Docker Containers & Install Composer
        shell: powershell
        run: |
          # ១. ចូលទៅកាន់ Folder គម្រោងក្នុង PC ទីពីរ (sokch)
          cd C:\Users\sokch\Desktop\my-laravel-app
          
          # ២. ទាញយកកូដថ្មីចុងក្រោយបង្អស់ពី GitHub
          git pull origin main
          
          # ៣. ឡុកចូល GitHub Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # ៤. បិទ Container ចាស់ចោល
          docker-compose down
          
          # ៥. បើកដំណើរការ Container ថ្មី (App, Nginx)
          docker-compose up -d --build
          
          # 🎯 ៦. ដំណោះស្រាយសំខាន់៖ បើកសិទ្ធិឱ្យ Folder Storage និង Cache (កម្ចាត់ Permission Denied)
          docker exec local-cms-container chmod -R 777 storage bootstrap/cache
          
          # ៧. ដោះស្រាយ Error vendor
          docker exec local-cms-container composer install --no-dev --optimize-autoloader
          
          # 🎯 ៨. រង់ចាំ ១០ វិនាទី ដើម្បីឱ្យម៉ាស៊ីន Database (MySQL) ឆេះឡើងដើរស្រួលបួលសិន (កម្ចាត់ Connection Refused)
          Start-Sleep -Seconds 10
          docker exec local-cms-container php artisan migrate:fresh --seed --force
          
          # ៩. សម្អាតកាកសំណល់ Image ចាស់ៗចោល
          docker image prune -f