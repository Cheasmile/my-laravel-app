name: Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Run Deployment Script
        shell: powershell
        run: |
          Set-Location -Path "C:\Users\sokch\Desktop\my-laravel-app"
          
          # 1. ទាញយកកូដថ្មី
          git fetch --all
          git reset --hard origin/main
          
          # 2. បិទ Docker
          docker-compose down -v
          
          # 3. Build ថ្មី
          docker-compose build --no-cache laravel-app
          
          # 4. បើកដំណើរការ
          docker-compose up -d
          
          # 5. រត់ Migration និង Clear Cache
          Start-Sleep -Seconds 10
          docker exec local-cms-container php artisan migrate --force
          docker exec local-cms-container php artisan optimize:clear