- name: Update Docker Containers & Install Composer
        shell: powershell
        run: |
          # 🎯 នេះជាផ្លូវពិតប្រាកដនៅលើម៉ាស៊ីន Operation PC (sokch)
          cd C:\Users\sokch\Desktop\my-laravel-app
          
          # ២. ទាញយកកូដថ្មីចុងក្រោយបង្អស់ពី GitHub
          git pull origin main
          
          # ៣. ឡុកចូល GitHub Registry លើ PC នោះ
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # ៤. បិទ Container ចាស់ចោល
          docker-compose down
          
          # ៥. បើកដំណើរការ Container ថ្មី (App, Nginx)
          docker-compose up -d --build
          
          # ៦. ដោះស្រាយ Error vendor
          docker exec local-cms-container composer install --no-dev --optimize-autoloader
          
          # ៧. រង់ចាំ ៥ វិនាទី រួចរត់បង្កើតតារាង Database និងចាក់ទិន្នន័យ Seed
          Start-Sleep -Seconds 5
          docker exec local-cms-container php artisan migrate:fresh --seed --force
          
          # ៨. សម្អាតកាកសំណល់ Image ចាស់ៗចោល
          docker image prune -f