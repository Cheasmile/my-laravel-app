name: CI/CD Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/cheasmile/my-laravel-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}     
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SERVER_SSH_KEY }}   
          port: 22
          script: |
            cd /var/www/cms-04 
            git pull origin main

            # ចូល Log in ដើម្បីទាញយក Image ពី Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # លុប Container ចាស់ចោល
            docker rm -f cms-container || true

            # ទាញយក Image ជំនាន់ចុងក្រោយ
            docker pull ghcr.io/cheasmile/my-laravel-app:latest

            # បើកដំណើរការ Container ថ្មីភ្ជាប់ទៅកាន់ Database XAMPP លើ Windows រួចបើក Port 8080
            docker run -d -p 8080:80 \
              --name cms-container \
              --add-host=host.docker.internal:host-gateway \
              --restart always \
              ghcr.io/cheasmile/my-laravel-app:latest

            # រត់បង្កើត Database Table និងចាក់ Seeder គណនី Admin ភ្លាមៗពីក្នុង Container ផ្ទាល់
            docker exec cms-container php artisan migrate:fresh --seed --force

            # សម្អាតចោល Image ចាស់ៗ
            docker image prune -f