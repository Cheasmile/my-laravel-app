- name: Deploy
        shell: powershell
        run: |
          cd C:\Users\sokch\Desktop\my-laravel-app
          
          # ១. ទាញយកកូដថ្មីពី GitHub មកកាន់ Folder លើម៉ាស៊ីន Sokh
          git fetch --all
          git reset --hard origin/main
          
          # ២. បិទ និងលុបអ្វីៗទាំងអស់ចោល
          docker-compose down -v
          
          # ៣. Build ថ្មីដោយបង្ខំ (គ្មាន Cache)
          docker-compose build --no-cache laravel-app
          
          # ៤. បើកដំណើរការវិញ
          docker-compose up -d
          
          # ៥. រត់ Migration ដើម្បីកុំឱ្យ Error ដូចមុន
          docker exec local-cms-container php artisan migrate --force
          docker exec local-cms-container php artisan optimize:clear