name: Deploy Automation
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        shell: powershell
        run: |
          cd C:\Users\sokch\Desktop\my-laravel-app
          
          # បិទ និងលុប Container, Network, និង Volume (ដកចេញ -v បើអ្នកមិនចង់លុប Volume)
          docker-compose down -v
          
          # ទាញយកកូដ និង Build ថ្មីដោយគ្មាន Cache
          docker-compose build --no-cache laravel-app
          
          # បើកដំណើរការវិញ
          docker-compose up -d
          
          # កំណត់សិទ្ធិ (Permission) ក្នុង Container
          docker exec local-cms-container chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          docker exec local-cms-container php artisan optimize:clear