name: CI/CD Production Deployment

on:
  push:
    branches:
      - main # ឱ្យវារត់រាល់ពេល Chea push កូដចូល branch main

jobs:
  # -------------------------------------------------------
  # JOB ទី ១៖ BUILD IMAGE រួចរុញទៅ GitHub Packages (GHCR)
  # -------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    
    # 🔥 ថែមប្លុកពិសេសនេះ ដើម្បីបើកសិទ្ធិឱ្យ GitHub Actions អាចសរសេរ Write Package ចូល Account Cheasmile បាន
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # បញ្ជាឱ្យស្វែងរកឈ្មោះ Owner (cheasmile) និងឈ្មោះ Repository (my-laravel-app) ដោយស្វ័យប្រវត្តិ
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

  # -------------------------------------------------------
  # JOB ទី ២៖ AUTOMATED OPERATIONS (DEPLOY TO SERVER SOKH)
  # -------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build # ត្រូវចាំឱ្យ Job Build ខាងលើជាប់ពណ៌បៃតងជោគជ័យសិន ទើបហក់មកធ្វើការងារនេះ

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}     # IP Address របស់ Server sokh
          username: ${{ secrets.SERVER_USER }} # Username (ឧទាហរណ៍៖ root)
          key: ${{ secrets.SERVER_SSH_KEY }}   # SSH Private Key សម្រាប់ចូល Server
          port: 22
          script: |
            # 1. ចូលទៅកាន់ Folder គម្រោងនៅលើ Server sokh
            cd /var/www/cms-04 

            # 2. ទាញយកកូដថ្មីចុងក្រោយពី GitHub ចូល Server
            git pull origin main

            # 3. ចូលទៅ Log in ក្នុង Docker លើ Server ដើម្បីមានសិទ្ធិ Pull Image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 4. លុប Container ចាស់ចោល (បើគ្មានទេ ក៏រត់ទៅមុខទៀតមិនឱ្យគាំង)
            docker rm -f cms-container || true

            # 5. បង្ខំឱ្យវាទាញយក (Pull) Docker Image ជំនាន់ថ្មីចែសដែលទើបតែ Build មិញ
            docker pull ghcr.io/cheasmile/my-laravel-app:latest

            # 6. បើកដំណើរការ Container ថ្មី បើក Port 8080 និងតភ្ជាប់ទៅកាន់ XAMPP MySQL លើ Windows រួចរត់ Seeder អូតូ
            docker run -d -p 8080:80 --name cms-container --add-host=host.docker.internal:host-gateway --restart always ghcr.io/cheasmile/my-laravel-app:latest

            # 7. សម្អាតពួក Image ចាស់ៗដែលលែងប្រើ (Dangling Images) កុំឱ្យណែន Drive របស់ Server
            docker image prune -f