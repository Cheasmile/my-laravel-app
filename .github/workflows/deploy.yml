name: CI/CD Production Deployment

on:
  push:
    branches:
      - main # ឱ្យវារត់រាល់ពេល Chea push កូដចូល branch main

jobs:
  # -------------------------------------------------------
  # JOB ទី ១៖ BUILD IMAGE រួចរុញទៅ GitHub Packages (GHCR)
  # -------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # ប្តូរត្រង់ cms-04-laravel-app ទៅតាមឈ្មោះ repository ពិតប្រាកដរបស់ Chea
          tags: ghcr.io/${{ github.repository }}/cms-04-laravel-app:latest

  # -------------------------------------------------------
  # JOB ទី ២៖ AUTOMATED OPERATIONS (DEPLOY TO SERVER SOKH)
  # -------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build # ត្រូវចាំឱ្យ Job Build ខាងលើជាប់ពណ៌បៃតងជោគជ័យសិន ទើបហក់មកធ្វើការងារនេះ

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}     # IP Address របស់ Server sokh
          username: ${{ secrets.SERVER_USER }} # Username (ឧទាហរណ៍៖ root)
          key: ${{ secrets.SERVER_SSH_KEY }}   # SSH Private Key សម្រាប់ចូល Server
          port: 22
          script: |
            # 1. ចូលទៅកាន់ Folder គម្រោងនៅលើ Server sokh
            cd /var/www/cms-04 

            # 2. ទាញយកកូដថ្មីចុងក្រោយ (រួមទាំងឯកសារ docker-compose.prod.yml និង nginx.conf) ពី GitHub
            git pull origin main

            # 3. ចូលទៅ Log in ក្នុង Docker លើ Server ដើម្បីមានសិទ្ធិ Pull Image ពី GitHub Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 4. បិទ Container ចាស់ៗចោលសិន (ទាំង Nginx និង Laravel)
            docker-compose -f docker-compose.prod.yml down

            # 5. បង្ខំឱ្យវាទាញយក (Pull) Docker Image ជំនាន់ថ្មីចែសដែលទើបតែ Build មិញ
            docker-compose -f docker-compose.prod.yml pull

            # 6. បើកដំណើរការ Nginx Hosting និង Laravel ឡើងវិញក្នុងលក្ខណៈ Background
            docker-compose -f docker-compose.prod.yml up -d

            # 7. សម្អាតពួក Image ចាស់ៗដែលលែងប្រើ (Dangling Images) កុំឱ្យណែន Drive របស់ Server
            docker image prune -f