name: CI/CD Production Deployment

on:
  push:
    branches:
      - main

jobs:
  # 🤖 រក្សាទុកតែ Job Build មួយគត់ដែលជាបេះដូងនៃ DevOps Assignment
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 🎯 ឈ្មោះអក្សរតូច cheasmile សុទ្ធដែល Chea កែត្រូវមុននេះ
          tags: ghcr.io/cheasmile/my-laravel-app:latest