name: Build and Push Docker Image

on:
  push:
    # កែប្រែត្រង់នេះឱ្យស្គាល់ទាំង ២ Branch តែម្ដងដើម្បីកុំឱ្យទើសថ្ងៃក្រោយ
    branches: [ "main", "my-local-changes" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
# ... (ទុកកូដខាងក្រោមឱ្យនៅដដែលទាំងអស់) ...

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # កែប្រែមកប្រើប្រាស់ chea007 ផ្លូវការ
        tags: chea007/cms-coffee-shop:latest