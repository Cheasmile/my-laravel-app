name: CI/CD Production Deployment

on:
  push:
    branches:
      - main # ឱ្យវារត់រាល់ពេល Chea push កូដចូល branch main

jobs:
  # -------------------------------------------------------
  # JOB ទី ១៖ BUILD IMAGE រួចរុញទៅ GitHub Packages (GHCR)
  # -------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 🎯 កែសម្រួលត្រង់នេះ៖ ប្តូរទៅជាអក្សរតូច (cheasmile) ទាំងអស់ដើម្បីកុំឱ្យ Docker គាំង Error
          tags: ghcr.io/cheasmile/my-laravel-app:latest

  # -------------------------------------------------------
  # JOB ទី ២៖ AUTOMATED OPERATIONS (DEPLOY TO SERVER SOKH)
  # -------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}     
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SERVER_SSH_KEY }}   
          port: 22
          script: |
            cd /var/www/cms-04 

            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker rm -f cms-container || true

            # 🎯 ប្រើប្រាស់ឈ្មោះអក្សរតូចដូចគ្នាទាំងអស់
            docker pull ghcr.io/cheasmile/my-laravel-app:latest

            docker run -d -p 8080:80 --name cms-container --add-host=host.docker.internal:host-gateway --restart always ghcr.io/cheasmile/my-laravel-app:latest

            docker image prune -f