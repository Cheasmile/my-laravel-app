name: CI/CD Production Deployment

on:
  push:
    branches:
      - main # 👈 ឱ្យវារត់រាល់ពេល Chea push ចូល branch main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 🎯 បញ្ជាឱ្យស្វែងរកឈ្មោះ owner (cheasmile) និងឈ្មោះ repository (my-laravel-app) ដោយស្វ័យប្រវត្តិ
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/cms-04 
            git pull origin main
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # ដំណើរការលុប container ចាស់ និង pull យក image ថ្មីចែសមកបើករត់ភ្លាមៗ
            docker rm -f cms-container || true
            docker pull ghcr.io/cheasmile/my-laravel-app:latest
            
            docker run -d -p 8080:80 --name cms-container --add-host=host.docker.internal:host-gateway --restart always ghcr.io/cheasmile/my-laravel-app:latest
            
            docker image prune -f