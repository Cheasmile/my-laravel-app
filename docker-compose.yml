version: '3.8'

services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-cms-container
    restart: always
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql-db # ឱ្យវារង់ចាំ Database ងើបឡើងសិន

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel-app

  # 🎯 ថែមសេវាកម្ម MySQL ចូលក្នុង Docker ហ្មង់ លែងប្រើ XAMPP
  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: cms_coffee_shop
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: