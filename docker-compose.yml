version: '3.8'

services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-cms-container
    restart: always
    networks:
      - cms-network
    depends_on:
      - mysql-db

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cms-network
    depends_on:
      - laravel-app

  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_DATABASE: cms_coffee_shop
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  db-data: