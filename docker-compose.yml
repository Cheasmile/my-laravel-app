services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-cms-container
    restart: always
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # ម៉ោនយក config ទៅប្រើ
    depends_on:
      - laravel-app